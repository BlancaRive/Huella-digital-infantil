<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="Tres momentos del día sin pantallas: las comidas, antes de dormir y la conversación">
  <rect width="700" height="300" rx="26" fill="#f7f5ef"/>
  <text x="350" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#20302d">Tres momentos protegidos</text>

  <g fill="#fff" stroke="#e5e5de" stroke-width="1.5">
    <rect x="38" y="76" width="192" height="182" rx="18"/>
    <rect x="254" y="76" width="192" height="182" rx="18"/>
    <rect x="470" y="76" width="192" height="182" rx="18"/>
  </g>

  <circle cx="134" cy="132" r="28" fill="none" stroke="#1f6f5b" stroke-width="5"/>
  <circle cx="134" cy="132" r="13" fill="#e2f0e9"/>
  <path d="M90 114 V150" stroke="#20302d" stroke-width="4" stroke-linecap="round"/>
  <path d="M178 114 V150" stroke="#20302d" stroke-width="4" stroke-linecap="round"/>

  <rect x="310" y="112" width="11" height="42" rx="4" fill="#20302d"/>
  <rect x="316" y="132" width="74" height="22" rx="6" fill="#1f6f5b"/>
  <rect x="324" y="118" width="24" height="14" rx="5" fill="#f4c95d"/>

  <rect x="532" y="108" width="68" height="46" rx="14" fill="#1f6f5b"/>
  <path d="M548 152 L548 172 L570 154 Z" fill="#1f6f5b"/>
  <circle cx="551" cy="131" r="4.5" fill="#fff"/>
  <circle cx="566" cy="131" r="4.5" fill="#fff"/>
  <circle cx="581" cy="131" r="4.5" fill="#fff"/>

  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <text x="134" y="204" font-size="19" font-weight="700" fill="#20302d">Las comidas</text>
    <text x="134" y="230" font-size="14" fill="#63706d">La mesa es para</text>
    <text x="134" y="248" font-size="14" fill="#63706d">conversar</text>

    <text x="350" y="204" font-size="19" font-weight="700" fill="#20302d">Antes de dormir</text>
    <text x="350" y="230" font-size="14" fill="#63706d">Pantallas fuera</text>
    <text x="350" y="248" font-size="14" fill="#63706d">del cuarto</text>

    <text x="566" y="204" font-size="19" font-weight="700" fill="#20302d">La conversación</text>
    <text x="566" y="230" font-size="14" fill="#63706d">Mirar a los ojos</text>
    <text x="566" y="248" font-size="14" fill="#63706d">antes que a la pantalla</text>
  </g>
</svg>
