<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-label="Ciclo de mediación docente en tres pasos: antes, durante y después de la experiencia digital">
  <rect width="700" height="270" rx="26" fill="#eaf5ef"/>

  <defs>
    <marker id="flecha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#1f6f5b"/>
    </marker>
  </defs>

  <path d="M192 104 H286" stroke="#1f6f5b" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 9" marker-end="url(#flecha)"/>
  <path d="M412 104 H506" stroke="#1f6f5b" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 9" marker-end="url(#flecha)"/>

  <circle cx="130" cy="104" r="50" fill="#1f6f5b"/>
  <circle cx="350" cy="104" r="50" fill="#f4c95d"/>
  <circle cx="570" cy="104" r="50" fill="#e97861"/>

  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="34" font-weight="800">
    <text x="130" y="117" fill="#fff">01</text>
    <text x="350" y="117" fill="#20302d">02</text>
    <text x="570" y="117" fill="#fff">03</text>
  </g>

  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <text x="130" y="192" font-size="21" font-weight="700" fill="#20302d">Antes</text>
    <text x="130" y="218" font-size="14" fill="#63706d">Definir el objetivo</text>
    <text x="130" y="236" font-size="14" fill="#63706d">y revisar el contenido</text>

    <text x="350" y="192" font-size="21" font-weight="700" fill="#20302d">Durante</text>
    <text x="350" y="218" font-size="14" fill="#63706d">Modelar el uso y</text>
    <text x="350" y="236" font-size="14" fill="#63706d">preguntar en voz alta</text>

    <text x="570" y="192" font-size="21" font-weight="700" fill="#20302d">Después</text>
    <text x="570" y="218" font-size="14" fill="#63706d">Dibujar, dramatizar,</text>
    <text x="570" y="236" font-size="14" fill="#63706d">construir, conversar</text>
  </g>
</svg>
