<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820"><rect width="700" height="820" rx="30" fill="#fff"/><rect x="35" y="35" width="630" height="750" rx="24" fill="#fff7ee"/><text x="350" y="95" text-anchor="middle" font-family="Arial" font-size="31" font-weight="800" fill="#3a2a20">5 preguntas antes de</text><text x="350" y="132" text-anchor="middle" font-family="Arial" font-size="31" font-weight="800" fill="#c9552e">encender una pantalla</text><g font-family="Arial"><circle cx="100" cy="210" r="35" fill="#c9552e"/><text x="100" y="220" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">1</text><text x="155" y="207" font-size="23" font-weight="700">¿Para qué?</text><text x="155" y="235" font-size="17" fill="#7a6356">¿Qué propósito tiene hoy?</text><circle cx="100" cy="320" r="35" fill="#ee8161"/><text x="100" y="330" text-anchor="middle" font-size="25" font-weight="800" fill="#3a2a20">2</text><text x="155" y="317" font-size="23" font-weight="700">¿Es apropiado?</text><text x="155" y="345" font-size="17" fill="#7a6356">¿Corresponde a su edad?</text><circle cx="100" cy="430" r="35" fill="#f2b544"/><text x="100" y="440" text-anchor="middle" font-size="25" font-weight="800">3</text><text x="155" y="427" font-size="23" font-weight="700">¿Puedo acompañar?</text><text x="155" y="455" font-size="17" fill="#7a6356">¿Podemos mirar y conversar?</text><circle cx="100" cy="540" r="35" fill="#c9552e"/><text x="100" y="550" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">4</text><text x="155" y="537" font-size="23" font-weight="700">¿Qué desplaza?</text><text x="155" y="565" font-size="17" fill="#7a6356">¿Quitamos juego o movimiento?</text><circle cx="100" cy="650" r="35" fill="#ee8161"/><text x="100" y="660" text-anchor="middle" font-size="25" font-weight="800" fill="#3a2a20">5</text><text x="155" y="647" font-size="23" font-weight="700">¿Qué hacemos después?</text><text x="155" y="675" font-size="17" fill="#7a6356">¿Cómo conectamos con 